<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <!-- Symmetric, front-facing sunglasses silhouette for AR overlay testing (AC4) — a real
       product photo wasn't available with a straight-on angle + transparent background, so
       this is drawn flat instead, which also guarantees it lines up correctly on a face. -->
  <g fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- left lens -->
    <rect x="40" y="55" width="210" height="120" rx="46" fill="#111417" fill-opacity="0.88" />
    <!-- right lens -->
    <rect x="350" y="55" width="210" height="120" rx="46" fill="#111417" fill-opacity="0.88" />
    <!-- bridge -->
    <path d="M250 100 Q300 78 350 100" />
    <!-- left temple -->
    <path d="M40 90 L0 78" />
    <!-- right temple -->
    <path d="M560 90 L600 78" />
  </g>
</svg>
