name: CI

# Lint + build + test (+ Docker image build, no push) for the three services with real
# code this sprint: api-gateway, product-service, web. face-processing-service and
# recommendation-service are intentionally excluded (Q5 — no real app code yet, see
# infra/README.md). user-service/order-service/payment-service are the other dev's and
# also excluded (no language decided yet, Q2).
#
# Each service's job is path-filtered (via dorny/paths-filter) so it only runs when its
# own folder changes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed services
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      product-service: ${{ steps.filter.outputs.product-service }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            product-service:
              - 'product-service/**'
            web:
              - 'web/**'

  api-gateway:
    name: api-gateway
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: api-gateway/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: api-gateway
          push: false
          tags: smart-eyewear/api-gateway:ci

  product-service:
    name: product-service
    needs: changes
    if: needs.changes.outputs.product-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service
    # Real Postgres service container so `test:e2e` (which needs a live DB — its Jest
    # globalSetup runs real migrations + fixtures, see test/global-setup.ts) can run in
    # CI too, not just the `test` unit suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: product_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/product_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: product-service/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: product-service
          push: false
          tags: smart-eyewear/product-service:ci

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: smart-eyewear/web:ci
