server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5433/payment_db?options=-c%20TimeZone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:manhdat}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

vnpay:
  version: "2.1.0"
  command: "pay"
  tmn-code: ${VNPAY_TMN_CODE:YOUR_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET:YOUR_HASH_SECRET}
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:8084/api/v1/payments/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:https://your-public-domain/api/v1/payments/vnpay/ipn}
  order-type: other
  locale: vn
  expire-minutes: 15