openapi: 3.0.3
info:
  title: product-service
  description: >
    Catalog service — brands, categories, products, variants, images.
    Code-first contract (see infra/docs/adr/0001-contract-sharing-mechanism.md and the
    Sprint 1 plan's Q7): written from the real NestJS implementation in
    `product-service/src`, not the other way around. Documents GET/POST/PATCH/DELETE
    /products, POST /products/:id/images, full CRUD for /categories and /brands, and GET /health
    (admin product management pass, see .planning/2026-07-11-admin-product-management.md).
    Face shapes are stored as a product enum array; variant stock is stored on the variant.
    0.3.0 adds material type, frame measurements (mm), image `kind` (TRY_ON) and the
    brandIds/materialType/color/sort list filters (.planning/2026-09-29-01-catalog-enrichment-seed.md).
    0.4.0 wraps every response in the shared envelope (see infra/contracts/README.md,
    .planning/2026-09-29-17-unified-response-pagination-cart-sync.md): success bodies are
    `{success: true, message, data}` (lists add `meta`), every error body is `ErrorResponse`
    (`{success: false, message, error: {code, details}}`). `GET /health` and 204 responses are
    not wrapped. `/categories` and `/brands` are now paginated like `/products`.
    0.5.0 adds the wishlist (`/wishlist`), product reviews (`/products/{id}/reviews`) and
    review moderation (`/admin/reviews`), `avgRating`/`reviewCount` on products and the
    `rating` sort (.planning/2026-09-29-02-wishlist-and-reviews.md). The caller's identity comes
    from the `X-User-Id`/`X-User-Name` headers set by api-gateway after its JWT check.
  version: "0.5.0"
servers:
  - url: http://localhost:3002
    description: product-service, direct (local dev only)
  - url: http://localhost:8080/api
    description: via api-gateway (same shapes, `/api` prefix — see api-gateway proxy)

# Read endpoints are public. Brand/category write endpoints require `catalog:manage`
# when requested through api-gateway; product-service trusts that edge enforcement.
security: []

tags:
  - name: products
  - name: categories
  - name: brands
  - name: wishlist
  - name: reviews
  - name: health

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Plain endpoint, no auth, no downstream calls.
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /products:
    get:
      tags: [products]
      summary: List products (filter + paginate)
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: brandId
          in: query
          description: Legacy single-brand filter, kept for backward compatibility — prefer `brandIds`.
          schema:
            type: string
            format: uuid
        - name: brandIds
          in: query
          description: >
            Comma-separated brand ids (`?brandIds=a,b`); matches products of any of them.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: materialType
          in: query
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: color
          in: query
          description: >
            Matches products having at least one variant of this color (case-insensitive,
            exact name, e.g. `Đen`).
          schema:
            type: string
        - name: frameShape
          in: query
          schema:
            $ref: "#/components/schemas/FrameShape"
        - name: genderTarget
          in: query
          schema:
            $ref: "#/components/schemas/GenderTarget"
        - name: faceShape
          in: query
          description: >
            Filters to products whose `faceShapes` array includes this face shape.
          schema:
            $ref: "#/components/schemas/FaceShape"
        - name: status
          in: query
          description: >
            Defaults to `PUBLISHED` server-side when omitted (unless `includeAllStatuses`
            is set).
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: includeAllStatuses
          in: query
          description: >
            Admin-only escape hatch (AC1): when `true` and `status` is not given, skips
            the default `status = PUBLISHED` filter and returns products in any status.
            Ignored if `status` is set. Public storefront behavior (default-to-PUBLISHED)
            is unchanged when this is omitted.
          schema:
            type: boolean
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          description: >
            `newest` = `createdAt` DESC; `price_asc`/`price_desc` order by `basePrice`,
            then `createdAt` DESC as a tiebreak; `rating` = `avgRating` DESC, then
            `reviewCount` DESC, then `createdAt` DESC.
          schema:
            type: string
            enum: [newest, price_asc, price_desc, rating]
            default: newest
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [products]
      summary: Create a product (admin)
      description: >
        `slug` and `sku` are auto-generated server-side from `name` (never supplied by
        the caller). `status` defaults to `PUBLISHED` when omitted (not the DB's own
        `DRAFT` default) since the admin UI's toggle only ever represents
        published/archived.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          description: >
            Validation failure, or `categoryId`/`brandId` does not reference an
            existing row.

  /products/slug/{slug}:
    get:
      tags: [products]
      summary: Get a single product by slug
      description: >
        Slug-based lookup for the public product-detail URL
        (`web`'s `/products/[slug]` route). Same response shape as
        `GET /products/{id}`.
      operationId: getProductBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "404":
          description: Product not found

  /products/{id}:
    get:
      tags: [products]
      summary: Get a single product by id
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "404":
          description: Product not found

    patch:
      tags: [products]
      summary: Update a product (admin)
      description: >
        Partial update — only fields present in the body are changed. If `faceShapes`
        is included, it replaces the product's full face-shape tag set.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          description: >
            Validation failure, or `categoryId`/`brandId` does not reference an
            existing row.
        "404":
          description: Product not found

    delete:
      tags: [products]
      summary: Soft-delete a product (admin)
      description: >
        Sets `deleted_at` (TypeORM soft delete) — never a hard delete. The row is
        excluded from all subsequent list/detail queries once deleted.
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Product soft-deleted
        "404":
          description: Product not found

  /products/{id}/images:
    post:
      tags: [products]
      summary: Upload a product or variant image (admin)
      description: >
        Multipart upload. Appends to the image list rather than replacing anything —
        `sortOrder` is the current max within the target group + 1. Omitting `variantId`
        attaches the image to the base product (max 8 images); passing a `variantId`
        attaches it to that variant instead (max 5 images), and the variant must belong
        to this product. A newly uploaded image never starts as the thumbnail — the
        admin sets it explicitly via `PATCH .../images/{imageId}`.
        `kind=TRY_ON` marks the image as the try-on overlay: it must be a PNG (checked by
        MIME type and magic bytes), and the product's previous TRY_ON image, if any, is
        demoted to `GALLERY` in the same transaction (at most one TRY_ON per product).
        Rejects anything that isn't `image/jpeg`, `image/png`, or `image/webp`, or is
        over 5 MB, with a 400 (server-side check, not just a client-side hint).
      operationId: uploadProductImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                variantId:
                  type: string
                  format: uuid
                  description: Omit to attach the image to the base product.
                kind:
                  $ref: "#/components/schemas/ImageKind"
              required: [file]
      responses:
        "201":
          description: Image uploaded and attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageEnvelope"
        "400":
          description: >
            Missing file, disallowed content type, file over 5 MB, `kind=TRY_ON` with a
            non-PNG file, `variantId` not
            belonging to this product, or the group's image count limit (8 for the
            product, 5 for a variant) already reached.
        "404":
          description: Product not found

  /products/{id}/images/{imageId}:
    patch:
      tags: [products]
      summary: Set an image as the thumbnail of its group (admin)
      description: >
        Marks `imageId` as the thumbnail and unsets any other thumbnail within the same
        group (the base product's own images, or a specific variant's images).
      operationId: setProductImageThumbnail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isThumbnail:
                  type: boolean
                  enum: [true]
              required: [isThumbnail]
      responses:
        "200":
          description: Image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageEnvelope"
        "400":
          description: "`isThumbnail` was not `true`."
        "404":
          description: Image not found, or it doesn't belong to this product.
    delete:
      tags: [products]
      summary: Delete a product or variant image (admin)
      operationId: deleteProductImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Image deleted
        "404":
          description: Image not found, or it doesn't belong to this product.

  /categories:
    get:
      tags: [categories]
      summary: List categories (paginated)
      description: >
        Ordered by `name` ASC. Admin screens and filter dropdowns that need every row call
        `limit=100`.
      operationId: listCategories
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [categories]
      summary: Create a category (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`.
        The server creates a unique slug from the name.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /categories/{id}:
    get:
      tags: [categories]
      summary: Get a category by id
      operationId: getCategoryById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags: [categories]
      summary: Update a category (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. Changing
        the name regenerates the unique slug.
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    delete:
      tags: [categories]
      summary: Delete a category (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. A category
        referenced by a product cannot be deleted until its products are moved or deleted.
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/CategoryInUseError"

  /brands:
    get:
      tags: [brands]
      summary: List brands (paginated)
      description: >
        Ordered by `name` ASC. Admin screens and filter dropdowns that need every row call
        `limit=100`.
      operationId: listBrands
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of brands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBrandResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [brands]
      summary: Create a brand (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. Brand names
        are unique after trimming whitespace and case normalization.
      operationId: createBrand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/BrandNameConflictError"

  /brands/{id}:
    get:
      tags: [brands]
      summary: Get a brand by id
      operationId: getBrandById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Brand found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags: [brands]
      summary: Update a brand (catalog manager)
      description: Through api-gateway, requires a bearer token with `catalog:manage`.
      operationId: updateBrand
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandRequest"
      responses:
        "200":
          description: Brand updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/BrandNameConflictError"

    delete:
      tags: [brands]
      summary: Delete a brand (catalog manager)
      description: >
        Through api-gateway, requires a bearer token with `catalog:manage`. A brand
        referenced by a product cannot be deleted until its products are moved or deleted.
      operationId: deleteBrand
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Brand deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/BrandInUseError"

  /wishlist:
    get:
      tags: [wishlist]
      summary: List the caller's liked products (newest like first)
      description: >
        Only PUBLISHED, non-deleted products are listed (and counted in `meta.total`).
      operationId: listWishlist
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of liked products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /wishlist/product-ids:
    get:
      tags: [wishlist]
      summary: Every product id the caller has liked (not paginated)
      description: Used only to paint the ❤ state on product cards — deliberately unpaginated.
      operationId: listWishlistProductIds
      parameters:
        - $ref: "#/components/parameters/XUserId"
      responses:
        "200":
          description: Liked product ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductIdsEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /wishlist/{productId}:
    post:
      tags: [wishlist]
      summary: Like a product (idempotent)
      description: "A repeated like keeps a single row and returns `created: false`."
      operationId: addToWishlist
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ProductIdPath"
      responses:
        "201":
          description: Liked (or already liked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistAddEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Product not found or not PUBLISHED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [wishlist]
      summary: Unlike a product (idempotent)
      operationId: removeFromWishlist
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ProductIdPath"
      responses:
        "204":
          description: Removed (or was not liked)
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /products/{id}/reviews/summary:
    get:
      tags: [reviews]
      summary: Rating summary of a product (public)
      operationId: getReviewSummary
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Average, count and 1–5 star distribution over PUBLISHED reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummaryEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/reviews:
    get:
      tags: [reviews]
      summary: List a product's PUBLISHED reviews, newest first (public)
      operationId: listProductReviews
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReviewResponse"
    post:
      tags: [reviews]
      summary: Review a purchased product
      description: >
        Only a buyer with an order in CONFIRMED/PROCESSING/SHIPPING/DELIVERED/COMPLETED
        containing the product may review it (checked against order-service, 3 s timeout).
        One review per user and product. The product's `avgRating`/`reviewCount` are
        updated in the same transaction.
      operationId: createReview
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserName"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created (`isVerifiedPurchase` = true, status PUBLISHED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Bạn cần mua sản phẩm này trước khi đánh giá
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found or not PUBLISHED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Bạn đã đánh giá sản phẩm này
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            Không thể xác minh lịch sử mua hàng, vui lòng thử lại sau (order-service down or
            timed out; code `SERVICE_UNAVAILABLE`). No review is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/reviews/mine:
    get:
      tags: [reviews]
      summary: The caller's own review of a product
      operationId: getMyReview
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: "The review, or `data: null` when the caller has not reviewed the product"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableReviewEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      tags: [reviews]
      summary: Edit the caller's own review
      operationId: updateMyReview
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewRequest"
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Bạn chưa đánh giá sản phẩm này
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [reviews]
      summary: Delete the caller's own review
      operationId: deleteMyReview
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Review deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Bạn chưa đánh giá sản phẩm này
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reviews:
    get:
      tags: [reviews]
      summary: List all reviews for moderation (admin, `product:manage` at the gateway)
      operationId: listAdminReviews
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated reviews (newest first) with the product name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAdminReviewResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /admin/reviews/{reviewId}/status:
    patch:
      tags: [reviews]
      summary: Hide or show a review (admin, `product:manage` at the gateway)
      description: HIDDEN reviews are excluded from the public list and the product aggregate.
      operationId: setReviewStatus
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/ReviewStatus"
              required: [status]
      responses:
        "200":
          description: Review with its new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      description: >
        Error envelope used by every non-2xx response. `error.code` is UPPER_SNAKE — generic
        by status when no specific code applies: 400 `BAD_REQUEST`, validation
        `VALIDATION_FAILED` (field errors in `details`), 401 `UNAUTHORIZED`, 403 `FORBIDDEN`,
        404 `NOT_FOUND`, 409 `CONFLICT`, 500 `INTERNAL_ERROR`.
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
          description: Vietnamese text for the user.
          example: Không tìm thấy sản phẩm 5f1c2d3e-0000-0000-0000-000000000001
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            details:
              oneOf:
                - type: object
                  nullable: true
                - type: array
                  items: {}
              description: >
                Extra data (object or array), e.g. field errors for `VALIDATION_FAILED`;
                `null` when there is none.
          required: [code, details]
      required: [success, message, error]

    SuccessEnvelope:
      type: object
      description: Base of every success body; `data` is added by each concrete envelope.
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: Thành công
      required: [success, message]

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required: [page, limit, total, totalPages]

    FrameShape:
      type: string
      enum: [ROUND, SQUARE, OVAL, CAT_EYE, AVIATOR, RECTANGLE, WAYFARER, RIMLESS]

    GenderTarget:
      type: string
      enum: [MALE, FEMALE, UNISEX]

    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    MaterialType:
      type: string
      description: >
        Normalized frame material. The free-text `material` field stays as the display label.
      enum: [ACETATE, METAL, TITANIUM, TR90, PLASTIC, MIXED]

    ImageKind:
      type: string
      description: >
        `TRY_ON` = transparent PNG used as the try-on overlay (at most one per product);
        `GALLERY` = any other image.
      enum: [GALLERY, TRY_ON]

    FaceShape:
      type: string
      description: >
        Which face shapes a product suits (FR7).
      enum: [ROUND, SQUARE, OVAL, HEART, DIAMOND, OBLONG]

    BrandSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
      required: [id, name, logoUrl]

    BrandResponse:
      type: object
      description: Public and management representation of a brand.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      required: [id, name, logoUrl, description]

    CreateBrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logoUrl:
          type: string
          format: uri
          maxLength: 512
          nullable: true
        description:
          type: string
          nullable: true
      required: [name]

    UpdateBrandRequest:
      type: object
      description: Partial update — every field from CreateBrandRequest is optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logoUrl:
          type: string
          format: uri
          maxLength: 512
          nullable: true
        description:
          type: string
          nullable: true

    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required: [id, name, slug]

    CategoryResponse:
      type: object
      description: Public and management representation of a one-level category.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required: [id, name, slug]

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required: [name]

    UpdateCategoryRequest:
      type: object
      description: Partial update — the server regenerates slug when name changes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    ProductVariantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        color:
          type: string
        colorHex:
          type: string
          nullable: true
          description: >
            Hex color code (e.g. `#E53935`), or `null` for a legacy variant created
            before the color picker was added.
        size:
          type: string
        extraPrice:
          type: number
        skuVariant:
          type: string
        stock:
          type: integer
          description: >
            Available stock (`quantity - reservedQuantity`). Present only in
            `GET /products/:id`; omitted from catalog listing responses.
      required: [id, color, colorHex, size, extraPrice, skuVariant]

    ProductImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
        isThumbnail:
          type: boolean
        sortOrder:
          type: integer
        kind:
          $ref: "#/components/schemas/ImageKind"
      required: [id, variantId, imageUrl, isThumbnail, sortOrder, kind]

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
          description: Free-text note on which faces this product fits well (FR7).
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        materialType:
          allOf:
            - $ref: "#/components/schemas/MaterialType"
          nullable: true
        lensWidthMm:
          type: integer
          nullable: true
        bridgeWidthMm:
          type: integer
          nullable: true
        templeLengthMm:
          type: integer
          nullable: true
        frameWidthMm:
          type: integer
          nullable: true
        basePrice:
          type: number
        status:
          $ref: "#/components/schemas/ProductStatus"
        avgRating:
          type: number
          description: Average of PUBLISHED review ratings, 2 decimals (0 when there are none).
        reviewCount:
          type: integer
          description: Number of PUBLISHED reviews.
        brand:
          $ref: "#/components/schemas/BrandSummary"
        category:
          $ref: "#/components/schemas/CategorySummary"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantResponse"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageResponse"
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sku
        - name
        - slug
        - description
        - faceFitNote
        - frameShape
        - genderTarget
        - material
        - materialType
        - lensWidthMm
        - bridgeWidthMm
        - templeLengthMm
        - frameWidthMm
        - basePrice
        - status
        - avgRating
        - reviewCount
        - brand
        - category
        - variants
        - images
        - faceShapes
        - createdAt
        - updatedAt

    CreateProductRequest:
      type: object
      description: >
        `sku`/`slug` are never accepted here — they're auto-generated server-side
        (Q1). `status` is optional; defaults to `PUBLISHED` if omitted.
      properties:
        name:
          type: string
          maxLength: 255
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        materialType:
          allOf:
            - $ref: "#/components/schemas/MaterialType"
          nullable: true
        lensWidthMm:
          type: integer
          minimum: 40
          maximum: 65
          nullable: true
        bridgeWidthMm:
          type: integer
          minimum: 12
          maximum: 26
          nullable: true
        templeLengthMm:
          type: integer
          minimum: 120
          maximum: 160
          nullable: true
        frameWidthMm:
          type: integer
          minimum: 110
          maximum: 160
          nullable: true
        basePrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        status:
          $ref: "#/components/schemas/ProductStatus"
      required:
        - name
        - categoryId
        - brandId
        - frameShape
        - genderTarget
        - basePrice

    UpdateProductRequest:
      type: object
      description: Partial update — every field from CreateProductRequest is optional.
      properties:
        name:
          type: string
          maxLength: 255
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        materialType:
          allOf:
            - $ref: "#/components/schemas/MaterialType"
          nullable: true
        lensWidthMm:
          type: integer
          minimum: 40
          maximum: 65
          nullable: true
        bridgeWidthMm:
          type: integer
          minimum: 12
          maximum: 26
          nullable: true
        templeLengthMm:
          type: integer
          minimum: 120
          maximum: 160
          nullable: true
        frameWidthMm:
          type: integer
          minimum: 110
          maximum: 160
          nullable: true
        basePrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        status:
          $ref: "#/components/schemas/ProductStatus"

    PaginatedProductResponse:
      description: List envelope for products — `data` is the current page, `meta` the paging info.
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ProductResponse"
            meta:
              $ref: "#/components/schemas/PageMeta"
          required: [data, meta]

    PaginatedCategoryResponse:
      description: List envelope for categories — `data` is the current page, `meta` the paging info.
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CategoryResponse"
            meta:
              $ref: "#/components/schemas/PageMeta"
          required: [data, meta]

    PaginatedBrandResponse:
      description: List envelope for brands — `data` is the current page, `meta` the paging info.
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BrandResponse"
            meta:
              $ref: "#/components/schemas/PageMeta"
          required: [data, meta]

    ProductEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ProductResponse"
          required: [data]

    ProductImageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ProductImageResponse"
          required: [data]

    CategoryEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CategoryResponse"
          required: [data]

    BrandEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BrandResponse"
          required: [data]

    ReviewStatus:
      type: string
      enum: [PUBLISHED, HIDDEN]

    ReviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        reviewerName:
          type: string
          description: Snapshot of the reviewer's username at write time.
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        isVerifiedPurchase:
          type: boolean
        status:
          $ref: "#/components/schemas/ReviewStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - productId
        - userId
        - reviewerName
        - rating
        - comment
        - isVerifiedPurchase
        - status
        - createdAt
        - updatedAt

    AdminReviewResponse:
      allOf:
        - $ref: "#/components/schemas/ReviewResponse"
        - type: object
          properties:
            productName:
              type: string
          required: [productName]

    ReviewSummary:
      type: object
      properties:
        avgRating:
          type: number
          description: Average of PUBLISHED ratings, 2 decimals (0 when there are none).
        reviewCount:
          type: integer
        distribution:
          type: object
          description: PUBLISHED review count per star.
          properties:
            "1":
              type: integer
            "2":
              type: integer
            "3":
              type: integer
            "4":
              type: integer
            "5":
              type: integer
          required: ["1", "2", "3", "4", "5"]
      required: [avgRating, reviewCount, distribution]

    CreateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
      required: [rating]

    UpdateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    ReviewEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReviewResponse"
          required: [data]

    NullableReviewEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/ReviewResponse"
              nullable: true
          required: [data]

    ReviewSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReviewSummary"
          required: [data]

    PaginatedReviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ReviewResponse"
            meta:
              $ref: "#/components/schemas/PageMeta"
          required: [data, meta]

    PaginatedAdminReviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AdminReviewResponse"
            meta:
              $ref: "#/components/schemas/PageMeta"
          required: [data, meta]

    WishlistAddEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                created:
                  type: boolean
                  description: false when the product was already liked.
              required: [created]
          required: [data]

    ProductIdsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
                format: uuid
          required: [data]

  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: Caller's user id, set by api-gateway after JWT verification. Missing/invalid → 401.
      schema:
        type: string
        format: uuid
    XUserName:
      name: X-User-Name
      in: header
      required: false
      description: Caller's username (JWT `sub`), stored as the reviewer name; defaults to "Người dùng".
      schema:
        type: string
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Cần đăng nhập để thực hiện thao tác này.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Bạn không có quyền quản lý danh mục.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Không tìm thấy thương hiệu hoặc danh mục.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandNameConflictError:
      description: Tên thương hiệu đã tồn tại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandInUseError:
      description: Không thể xoá thương hiệu vì vẫn còn sản phẩm đang sử dụng. Vui lòng chuyển hoặc xoá sản phẩm trước.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CategoryInUseError:
      description: Không thể xoá danh mục vì vẫn còn sản phẩm đang sử dụng. Vui lòng chuyển hoặc xoá sản phẩm trước.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
