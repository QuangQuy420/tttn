spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/user_service
    username: ${DB_USERNAME:manhdat}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8081
# jwt.secret and internal.api-key have no default: they come only from the JWT_SECRET and
# INTERNAL_API_KEY env vars (UserServiceApplication fails startup when either is missing).
jwt:
  expiration: 3600000