openapi: 3.0.3
info:
  title: product-service
  description: >
    Catalog service — brands, categories, products, variants, images.
    Code-first contract (see infra/docs/adr/0001-contract-sharing-mechanism.md and the
    Sprint 1 plan's Q7): written from the real NestJS implementation in
    `product-service/src`, not the other way around. Documents GET/POST/PATCH/DELETE
    /products, POST /products/:id/images, GET /categories, GET /brands, GET /health
    (admin product management pass, see .planning/2026-07-11-admin-product-management.md).
    `ps_inventory`/`ps_tags`/`ps_product_tags`/`ps_ratings`/`ps_face_shape_styles` have
    migrated tables but no endpoints yet (Sprint 1 Q10) and are intentionally absent here.
  version: "0.2.0"
servers:
  - url: http://localhost:3002
    description: product-service, direct (local dev only)
  - url: http://localhost:8080/api
    description: via api-gateway (same shapes, `/api` prefix — see api-gateway proxy)

# No auth on any endpoint today — edge JWT verification is deferred (see the Sprint 1
# plan's Q3); these routes are proxied/served unauthenticated for now.
security: []

tags:
  - name: products
  - name: categories
  - name: brands
  - name: health

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Plain endpoint, no auth, no downstream calls.
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /products:
    get:
      tags: [products]
      summary: List products (filter + paginate)
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: brandId
          in: query
          schema:
            type: string
            format: uuid
        - name: frameShape
          in: query
          schema:
            $ref: "#/components/schemas/FrameShape"
        - name: genderTarget
          in: query
          schema:
            $ref: "#/components/schemas/GenderTarget"
        - name: faceShape
          in: query
          description: >
            Filters to products tagged (via `ps_product_face_shapes`) as suiting this
            face shape.
          schema:
            $ref: "#/components/schemas/FaceShape"
        - name: status
          in: query
          description: >
            Defaults to `PUBLISHED` server-side when omitted (unless `includeAllStatuses`
            is set).
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: includeAllStatuses
          in: query
          description: >
            Admin-only escape hatch (AC1): when `true` and `status` is not given, skips
            the default `status = PUBLISHED` filter and returns products in any status.
            Ignored if `status` is set. Public storefront behavior (default-to-PUBLISHED)
            is unchanged when this is omitted.
          schema:
            type: boolean
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductResponse"
        "400":
          description: Invalid query parameters (validation failure)

    post:
      tags: [products]
      summary: Create a product (admin)
      description: >
        `slug` and `sku` are auto-generated server-side from `name` (never supplied by
        the caller). `status` defaults to `PUBLISHED` when omitted (not the DB's own
        `DRAFT` default) since the admin UI's toggle only ever represents
        published/archived.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: >
            Validation failure, or `categoryId`/`brandId` does not reference an
            existing row.

  /products/{id}:
    get:
      tags: [products]
      summary: Get a single product by id
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found

    patch:
      tags: [products]
      summary: Update a product (admin)
      description: >
        Partial update — only fields present in the body are changed. If `faceShapes`
        is included, it replaces the product's full face-shape tag set.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: >
            Validation failure, or `categoryId`/`brandId` does not reference an
            existing row.
        "404":
          description: Product not found

    delete:
      tags: [products]
      summary: Soft-delete a product (admin)
      description: >
        Sets `deleted_at` (TypeORM soft delete) — never a hard delete. The row is
        excluded from all subsequent list/detail queries once deleted.
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Product soft-deleted
        "404":
          description: Product not found

  /products/{id}/images:
    post:
      tags: [products]
      summary: Upload/replace a product image slot (admin)
      description: >
        Multipart upload. `slot` maps to `sortOrder` (`main`→0, `angle1`→1, `angle2`→2,
        `angle3`→3); `main` is also marked `isThumbnail`. Re-uploading to a slot already
        in use replaces the existing image for that slot rather than duplicating it.
        Rejects anything that isn't `image/jpeg`, `image/png`, or `image/webp`, or is
        over 5 MB, with a 400 (server-side check, not just a client-side hint).
      operationId: uploadProductImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                slot:
                  type: string
                  enum: [main, angle1, angle2, angle3]
              required: [file, slot]
      responses:
        "201":
          description: Image uploaded and attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageResponse"
        "400":
          description: >
            Missing file/slot, disallowed content type, or file over 5 MB.
        "404":
          description: Product not found

  /categories:
    get:
      tags: [categories]
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          description: Flat list of categories (self-referential via parentId)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"

  /brands:
    get:
      tags: [brands]
      summary: List all brands
      operationId: listBrands
      responses:
        "200":
          description: Flat list of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandResponse"

components:
  schemas:
    FrameShape:
      type: string
      enum: [ROUND, SQUARE, OVAL, CAT_EYE, AVIATOR, RECTANGLE, WAYFARER, RIMLESS]

    GenderTarget:
      type: string
      enum: [MALE, FEMALE, UNISEX]

    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    FaceShape:
      type: string
      description: >
        Which face shapes a product suits (FR7) — independent of the global
        face-shape → frame-shape recommendation rule table (`ps_face_shape_styles`).
      enum: [ROUND, SQUARE, OVAL, HEART, DIAMOND, OBLONG]

    BrandSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
      required: [id, name, logoUrl]

    BrandResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
      required: [id, name, logoUrl]

    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required: [id, name, slug]

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
      required: [id, name, slug, parentId]

    ProductVariantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        color:
          type: string
        size:
          type: string
        extraPrice:
          type: number
        skuVariant:
          type: string
      required: [id, color, size, extraPrice, skuVariant]

    ProductImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
        isThumbnail:
          type: boolean
        sortOrder:
          type: integer
      required: [id, variantId, imageUrl, isThumbnail, sortOrder]

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
          description: Free-text note on which faces this product fits well (FR7).
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        basePrice:
          type: number
        status:
          $ref: "#/components/schemas/ProductStatus"
        brand:
          $ref: "#/components/schemas/BrandSummary"
        category:
          $ref: "#/components/schemas/CategorySummary"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantResponse"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageResponse"
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sku
        - name
        - slug
        - description
        - faceFitNote
        - frameShape
        - genderTarget
        - material
        - basePrice
        - status
        - brand
        - category
        - variants
        - images
        - faceShapes
        - createdAt
        - updatedAt

    CreateProductRequest:
      type: object
      description: >
        `sku`/`slug` are never accepted here — they're auto-generated server-side
        (Q1). `status` is optional; defaults to `PUBLISHED` if omitted.
      properties:
        name:
          type: string
          maxLength: 255
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        basePrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        status:
          $ref: "#/components/schemas/ProductStatus"
      required:
        - name
        - categoryId
        - brandId
        - frameShape
        - genderTarget
        - basePrice

    UpdateProductRequest:
      type: object
      description: Partial update — every field from CreateProductRequest is optional.
      properties:
        name:
          type: string
          maxLength: 255
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        frameShape:
          $ref: "#/components/schemas/FrameShape"
        genderTarget:
          $ref: "#/components/schemas/GenderTarget"
        material:
          type: string
          nullable: true
        basePrice:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          nullable: true
        faceFitNote:
          type: string
          nullable: true
        faceShapes:
          type: array
          items:
            $ref: "#/components/schemas/FaceShape"
        status:
          $ref: "#/components/schemas/ProductStatus"

    PaginatedProductResponse:
      type: object
      description: >
        Flat pagination envelope (NOT a nested data/meta shape) — see
        product-service/src/routes/dto/paginated-response.dto.ts.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [items, total, page, limit, totalPages]
