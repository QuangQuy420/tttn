# ============================================================================
# Smart Eyewear — local orchestration (LOCAL ONLY, no production deploy).
#
# Monorepo, split-ready layout: build contexts point to sibling service folders
# (../<service>), kept structured so a future polyrepo split is a folder extraction,
# not a rewrite. Before `up`: copy infra/.env.example -> infra/.env, and each
# <service>/.env.example -> <service>/.env.
#
# ⚠️ api-gateway, product-service, web, and face-processing-service are real, building
#    services with healthchecks. user-service/order-service/payment-service still have no
#    language decided (Q2) — their Dockerfiles are placeholders (`file with no instructions`),
#    which would abort a bare `docker compose up --build` before ANY container starts.
#    recommendation-service has a real Dockerfile (python:3.11-slim) that builds, but no
#    app/main.py yet, so its container would build then crash-loop.
#    These four are gated behind the `not-ready` Compose profile so a bare `docker compose up
#    --build` (no profile) only builds/starts Postgres/Redis/MinIO + api-gateway +
#    product-service + web + face-processing-service — matching this sprint's AC1. Once a
#    service's app lands, drop its `profiles:` key here. To bring the gated ones up anyway:
#    `docker compose --profile not-ready up --build`. See infra/README.md for the up-to-date
#    per-service status.
# ============================================================================

name: smart-eyewear

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Business services ----------------
  # NOTE: internal services are not published to the host on purpose —
  # all traffic enters through the gateway (North-South).

  api-gateway:
    build: ../api-gateway
    env_file: ../api-gateway/.env
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    # user-service intentionally NOT listed here: api-gateway doesn't call it yet
    # (edge JWT / `/api/auth/*` proxying is deferred — see Q3 in the sprint plan).
    # Re-add `user-service: condition: service_healthy` once that proxy exists —
    # until then, a hard dependency would block api-gateway from coming up whenever
    # user-service's Dockerfile (still a placeholder) fails to build.
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build: ../user-service     # ⚠️ language TBD (Q2)
    env_file: ../user-service/.env
    profiles: [not-ready]
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ../product-service
    env_file: ../product-service/.env
    # The seed runner (T11, src/seed.ts) resolves the seed file to /infra/seed/products.json
    # (matches the monorepo layout when run on the host) — bind-mount the same path so
    # `docker compose exec product-service node dist/seed.js` also works from a clean checkout.
    volumes:
      - ./seed:/infra/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build: ../order-service    # ⚠️ language TBD (Q2)
    env_file: ../order-service/.env
    profiles: [not-ready]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_started

  payment-service:
    build: ../payment-service  # ⚠️ language TBD (Q2)
    env_file: ../payment-service/.env
    profiles: [not-ready]
    depends_on:
      postgres:
        condition: service_healthy

  face-processing-service:
    build: ../face-processing-service
    env_file: ../face-processing-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  recommendation-service:
    build: ../recommendation-service
    env_file: ../recommendation-service/.env
    profiles: [not-ready]
    depends_on:
      - product-service

  web:
    build:
      context: ../web
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time — env_file below
      # only reaches the container at runtime, which is too late for Next.js. Default matches
      # web/.env.example (browser reaches the gateway's published host port).
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    env_file: ../web/.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  miniodata:
