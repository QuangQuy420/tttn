server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_db}
    username: ${DB_USERNAME:manhdat}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # OutboxRelay ticks every second; extra threads keep a slow relay tick from delaying the
  # reconciliation and idempotency-key cleanup jobs.
  task:
    scheduling:
      pool:
        size: 3

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Fail fast when the broker is down so OutboxRelay reschedules instead of blocking.
    connection-timeout: 3s
    # OutboxRelay waits for a broker ack per message and treats unroutable (returned) messages
    # as failures.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

services:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:3002}

cart:
  key-prefix: "cart:"
  expiration-days: ${CART_EXPIRATION_DAYS:7}

app:
  saga:
    delivery-limit: ${SAGA_QUEUE_DELIVERY_LIMIT:10}
    chaos-mode: ${SAGA_CHAOS_MODE:NONE}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:20}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}

internal:
  api-key: ${INTERNAL_API_KEY:change-me-in-.env}
