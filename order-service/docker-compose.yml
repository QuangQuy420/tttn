services:
  order-postgres:
    image: postgres:17
    container_name: order-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: manhdat
      POSTGRES_PASSWORD: 123

    ports:
      - "5434:5432"

    volumes:
      - order_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U manhdat -d order_db
      interval: 10s
      timeout: 5s
      retries: 5

  order-redis:
    image: redis:7.4-alpine
    container_name: order-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - order_redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  order_postgres_data:
  order_redis_data: